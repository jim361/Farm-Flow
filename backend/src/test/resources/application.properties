spring.datasource.url=jdbc:h2:mem:farmflow_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
jwt.secret=farmflow-jwt-secret-key-must-be-at-least-32-chars!!
jwt.expiration-ms=86400000
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=farmflow-backend-test
mqtt.topic.sensor=farm/sensor/#
mqtt.topic.control=farm/control
