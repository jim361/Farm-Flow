spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/farmflow
spring.datasource.username=farmflow
spring.datasource.password=${DB_PASSWORD:farmflow1234}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret=${JWT_SECRET:farmflow-jwt-secret-key-must-be-at-least-32-chars!!}
jwt.expiration-ms=86400000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.api-docs.version=openapi_3_0

# MQTT
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=farmflow-backend
mqtt.topic.sensor=farm/sensor/#
mqtt.topic.control=farm/control