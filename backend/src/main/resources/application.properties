spring.application.name=backend

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/farmflow
spring.datasource.username=farmflow
spring.datasource.password=farmflow1234

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# MQTT demo settings
farmflow.mqtt.broker-url=tcp://localhost:1883
farmflow.mqtt.telemetry-topic=farmflow/devices/+/telemetry
farmflow.mqtt.command-topic-prefix=farmflow/devices
